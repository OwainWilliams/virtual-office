<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Office</title>
<style>
  :root {
    --page: #171a24; --panel: #1f2330; --raised: #2a2f40; --line: #394056;
    --text: #eef0f6; --muted: #a9b0c3; --accent: #8fb4ff; --accent-ink: #0e1630;
    --working: #58d68d; --waiting: #ffb020; --idle: #8b93a8; --danger: #ff8f8f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--page); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  .chip { background: var(--raised); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--muted); }
  .chip.alert { color: var(--waiting); border-color: var(--waiting); }
  .spacer { flex: 1; }
  .button:disabled { opacity: .6; cursor: default; }
  .board-hit { position: absolute; background: transparent; border: 2px solid transparent; border-radius: 4px; padding: 0; }
  .board-hit:hover { border-color: var(--accent); }
  .board-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .counts { display: flex; flex-wrap: wrap; gap: 8px; }
  .board-link { color: var(--accent); align-self: flex-start; }
  .count { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 90px; }
  .count strong { display: block; font-size: 22px; }
  .count span { color: var(--muted); font-size: 13px; }
  .project { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  select, .fields input { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; color: var(--text); font: inherit; }
  .fields { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .fields label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 13px; }
  .fields .choices { display: flex; gap: 8px; }
  .tag em { display: block; font-style: normal; color: var(--accent); max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .button { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
  .button:hover { border-color: var(--accent); }
  .button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .button.danger { color: var(--danger); }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
  .floor { padding: 16px; overflow: auto; display: flex; align-items: flex-start; justify-content: center; }
  .stage { position: relative; width: 100%; max-width: 1200px; aspect-ratio: 400 / 250; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .stage canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .tag { position: absolute; transform: translate(-50%, 0); background: rgba(23, 26, 36, .92); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; text-align: center; white-space: nowrap; font-size: 12px; line-height: 1.3; }
  .tag:hover { border-color: var(--accent); }
  .tag em.model { color: var(--waiting); }
  .tag.away { opacity: .7; border-style: dashed; }
  .tag strong { display: block; font-size: 13px; }
  .tag span { color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--idle); }
  .dot.working { background: var(--working); }
  .dot.waiting { background: var(--waiting); }
  .bubble { position: absolute; transform: translate(-50%, -100%); max-width: 26%; background: #fff; color: #1b1e29; border-radius: 8px; padding: 2px 8px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  .bubble.waiting { background: var(--waiting); }

  .chat { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .chat-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .chat h2 { font-size: 15px; margin: 0; flex: 1; }
  main.chat-wide { grid-template-columns: minmax(0, 1fr) minmax(380px, 64vw); }
  main.chat-wide .message { max-width: 100%; }
  .chat h2 small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
  #timeline { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .message { max-width: 92%; padding: 8px 12px; border-radius: 12px; background: var(--raised); white-space: pre-wrap; overflow-wrap: anywhere; }
  .message.owner { align-self: flex-end; background: #34497a; }
  .message.system { align-self: center; background: none; color: var(--muted); font-size: 13px; padding: 0; }
  .message .who { display: block; font-size: 12px; color: var(--muted); }
  .card { border: 1px solid var(--waiting); border-radius: 12px; padding: 10px 12px; background: var(--raised); white-space: pre-wrap; overflow-wrap: anywhere; }
  .card.answered { border-color: var(--line); }
  .card .who { display: block; font-size: 12px; color: var(--waiting); font-weight: 600; }
  .card.answered .who { color: var(--muted); }
  .card .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .card .other { display: flex; gap: 6px; margin-top: 8px; }
  .card .other input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  .card .answer { margin-top: 6px; color: var(--muted); font-size: 13px; }
  .rich { white-space: normal; }
  .rich p { margin: 0 0 8px; }
  .rich p.heading { font-weight: 600; }
  .rich ul, .rich ol { margin: 0 0 8px; padding-left: 22px; }
  .rich li { margin-bottom: 3px; }
  .rich > :last-child { margin-bottom: 0; }
  .rich code, .approval code { background: var(--page); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font: 13px ui-monospace, Consolas, monospace; }
  .rich pre, .approval pre { background: var(--page); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 0 0 8px; font: 13px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }
  .rich a { color: var(--accent); }
  .message.system.rich p { margin: 0; }
  .approval { white-space: normal; }
  .approval p { margin: 0; }
  .approval .headline { font-size: 16px; }
  .approval .context { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .approval .steps { margin: 10px 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
  .approval .steps li { color: var(--muted); }
  .approval .steps li.needs { color: var(--text); }
  .approval .badge { margin-left: 8px; font-size: 11px; color: var(--waiting); border: 1px solid var(--waiting); border-radius: 999px; padding: 0 6px; white-space: nowrap; }
  .approval summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .approval details[open] summary { margin-bottom: 6px; }
  form.composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  form.composer textarea { flex: 1; resize: none; height: 64px; background: var(--page); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .empty { color: var(--muted); }

  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; width: min(720px, 92vw); max-height: 82vh; padding: 0; }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  dialog header { position: sticky; top: 0; background: var(--panel); }
  dialog h2 { margin: 0; font-size: 16px; }
  #log { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .entry { border-left: 3px solid var(--line); padding-left: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .entry time { color: var(--muted); font-size: 12px; margin-right: 6px; }
  .entry.does { color: var(--muted); }
  .entry.task { border-color: var(--accent); }
  .entry.report { border-color: var(--working); }
  .entry.error { border-color: var(--danger); }

  @media (max-width: 900px) {
    body { height: auto; }
    main { grid-template-columns: 1fr; }
    .chat { border-left: 0; border-top: 1px solid var(--line); height: 70vh; }
    .tag span { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Virtual Office</h1>
  <label class="project">Project
    <select id="project"></select>
  </label>
  <button class="button" id="add-project" type="button">Add project</button>
  <span class="chip" id="summary">Connecting…</span>
  <span class="chip" id="demo" hidden>Demo mode</span>
  <span class="spacer"></span>
  <button class="button" id="standup" type="button" title="The project manager triages the board and the manager posts the plan for the day">Stand-up</button>
  <button class="button" id="end-of-day" type="button" title="The manager posts what was done, what is waiting on you and today's spend">End of day</button>
  <button class="button" id="notify" type="button" hidden>Turn on notifications</button>
  <span class="chip" id="usage" title="Tokens used by the agents on this project"></span>
  <button class="button danger" id="stop" type="button">Stop everyone</button>
</header>
<main>
  <section class="floor" aria-label="Office floor">
    <div class="stage" id="stage">
      <canvas id="canvas" role="img" aria-label="Pixel-art office showing each agent at their desk"></canvas>
    </div>
  </section>
  <section class="chat" aria-label="Chat with the manager">
    <div class="chat-head">
      <h2><span id="manager-name">Manager</span><small>Your only point of contact. Staff never message you directly.</small></h2>
      <button class="button" id="chat-size" type="button" aria-pressed="false">Expand</button>
    </div>
    <div id="timeline" aria-live="polite"></div>
    <form class="composer" id="composer">
      <textarea id="input" placeholder="Tell the manager what you need…" aria-label="Message the manager"></textarea>
      <button class="button primary" type="submit">Send</button>
    </form>
  </section>
</main>
<dialog id="drawer" aria-labelledby="drawer-title">
  <header>
    <h2 id="drawer-title"></h2>
    <span class="spacer"></span>
    <button class="button danger" type="button" id="drawer-stop" hidden>Stop</button>
    <button class="button" type="button" id="drawer-close">Close</button>
  </header>
  <div id="log"></div>
</dialog>
<dialog id="board-dialog" aria-labelledby="board-title">
  <header>
    <h2 id="board-title">Board</h2>
    <span class="spacer"></span>
    <button class="button" type="button" id="board-close">Close</button>
  </header>
  <div id="board-body" class="board-body"></div>
</dialog>
<dialog id="project-dialog" aria-labelledby="project-dialog-title">
  <form id="project-form" class="fields">
    <h2 id="project-dialog-title">Add a project</h2>
    <p id="project-welcome" hidden>Welcome. Pick the folder of a git repository for your team to work on. You can add more projects later.</p>
    <label>Name <input id="project-name" required maxlength="60"></label>
    <label>Folder (full path to the repository) <input id="project-path" required maxlength="400" placeholder="e.g. C:\Users\you\code\app or /home/you/code/app"></label>
    <label>Jira project key (optional) <input id="project-jira" maxlength="20" placeholder="ABC"></label>
    <div class="choices">
      <button class="button primary" type="submit">Add</button>
      <button class="button" type="button" id="project-cancel">Cancel</button>
    </div>
  </form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
